# Checks every push: the launcher builds and its unit tests pass, and the Live TV app has no analyzer issues.
# Nothing here talks to a TV.
name: Build

on:
  push:
  pull_request:

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build launcher and run unit tests
        working-directory: launcher
        run: ./gradlew assembleDebug testDebugUnitTest

  live-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.8
          channel: stable
      - name: Analyze Live TV
        working-directory: apps/live-tv
        run: |
          flutter pub get
          flutter analyze
