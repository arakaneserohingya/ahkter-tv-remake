allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Plugins default to Flutter's newer NDK; reuse the one the app already pins (saves a 2.4 GB download).
subprojects {
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            p.android.ndkVersion = "27.0.12077973"
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
